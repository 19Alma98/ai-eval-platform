[mypy]
python_version = 3.12
strict = true
# Monorepo caveats when running `mypy ./` from the repo root:
# - examples/*/main.py share the module name "main"
# - backend and sdk both ship the package name "aiobs"
# Prefer package-scoped checks (matches CI):
#   cd backend && uv run mypy src/aiobs_server
#   cd sdk && uv run mypy src/aiobs
exclude = (?x)(
    ^examples/
  | ^frontend/
  | ^scripts/
  | ^docs/
  | ^docker/
  | ^sdk/
  | ^backend/tests/
    )

[mypy-asyncpg.*]
ignore_missing_imports = true

[mypy-opentelemetry.*]
ignore_missing_imports = true

[mypy-google.protobuf.*]
ignore_missing_imports = true

[mypy-litellm.*]
ignore_missing_imports = true

[mypy-jsonschema.*]
ignore_missing_imports = true
