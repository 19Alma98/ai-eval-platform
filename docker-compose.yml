services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opengrade
      POSTGRES_PASSWORD: opengrade
      POSTGRES_DB: opengrade
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opengrade -d opengrade"]
      interval: 2s
      timeout: 5s
      retries: 15

  # API and UI in one image (same static UI as `opengrade ui`): http://localhost:8000
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile

    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://opengrade:opengrade@postgres:5432/opengrade
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # Required for OTLP → dataset from-trace (portfolio demo)
      CONTENT_CAPTURE_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
