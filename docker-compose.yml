services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiobs
      POSTGRES_PASSWORD: aiobs
      POSTGRES_DB: aiobs
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiobs -d aiobs"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://aiobs:aiobs@postgres:5432/aiobs
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
