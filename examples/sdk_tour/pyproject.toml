[project]
name = "opengrade-sdk-tour"
version = "0.1.0"
description = "Guided tour of the OpenGrade Python SDK: tracing, RAG verification, architecture comparison and custom monitoring metrics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opengrade-ai>=0.2.0",
]

[project.optional-dependencies]
llm = [
    "opengrade-ai[openai]>=0.2.0",
    "openai>=1.50",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[tool.uv]
# Scripts + a local package imported from the project directory: nothing to build.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["nimbus_apps"]
