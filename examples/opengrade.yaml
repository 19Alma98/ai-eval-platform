# Shared config for `opengrade evaluate` and/or `opengrade check`.
# Reserved top-level keys (meta + evaluate) are stripped before release-check.

# Omit api_base_url (or set null) so `opengrade evaluate` starts an embedded API+SQLite.
# api_base_url: https://opengrade.internal

project: demo

evaluate:
  # Preferred: clone dataset + metrics_set from an exam created in the UI / a prior run.
  # from_experiment: "0411fb26-58af-4d71-8cd1-9feae99fea84"
  # XOR bootstrap (embedded / first exam):
  task: my_app.rag:answer          # XOR script: scripts/ci_rag_eval.py
  dataset: tests/rag_gold.csv
  metrics: [hit_at_k, groundedness, correctness, latency]
  name: ci
  # baseline: alias:main             # needs a persistent server
  # promote: main                    # CI on main only
  task_type: rag_qa
  max_concurrency: 4
  # repeats: 3                       # run each item 3x; scores average per item, flaky items reported
  init: false
  judge:
    model: openai/gpt-4o-mini
    # api_base: https://api.openai.com/v1
    api_key_env: LLM_API_KEY       # reads os.environ; set via CI secrets

# Policy blocks (used by evaluate when present, and by `opengrade check`).
hit_at_k:
  min: 0.8
groundedness:
  min: 0.7
correctness:
  min: 0.7
latency:
  p95_max_ms: 30000
regression:
  max_delta: -0.05
# groups:
#   by: category
#   min_items: 5
