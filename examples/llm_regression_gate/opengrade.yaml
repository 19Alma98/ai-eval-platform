# LLM regression gate: "the PR must be at least as good as the last accepted main run",
# for a pipeline whose answers change from run to run (sampling LLM) and whose quality
# is partly scored by an LLM judge.
#
#   PR:            opengrade evaluate --config opengrade.yaml --require-baseline
#   push to main:  opengrade evaluate --config opengrade.yaml --promote main
#
# Compared with examples/ci_regression_gate (deterministic), this config adds:
#   repeats             each question runs 3 times
#   pinned judge        judge model + temperature 0
#   critical            must-pass questions (security) that may never fail, in any repeat
#   max_new_failures    retrieval may not lose a single question that main got right
#   statistical power   a warning (or a failing check) when the gold set is too small to detect the drop you care about

project: llm-regression-gate

evaluate:
  task: rag_app:task
  dataset: gold.jsonl
  name: rag-llm-ci
  task_type: rag_qa
  baseline: alias:main
  repeats: 3                 # 24 questions x 3 = 72 LLM calls + judge calls per run
  max_concurrency: 4
  init: true
  params:
    app_model: gemma4:e2b
    prompt: v1
  judge:
    model: ollama/gemma4:e2b
    api_base: http://localhost:11434
    # api_key_env: LLM_API_KEY         # CI: name of the env var holding the judge key
  metrics:
    - hit_at_k
    - must_contain
    - {kind: groundedness, config: {temperature: 0}}
    - {kind: correctness, config: {temperature: 0}}
    - latency

# ---- Policy -------------------------------------------------------------------------
hit_at_k:
  min: 0.9
must_contain:
  min: 0.75
groundedness:
  min: 0.7
correctness:
  min: 0.7
latency:
  p95_max_ms: 40000
  max_increase_pct: 50

experiment_metrics:
  opengrade.error_rate:
    max: 0.05
    max_increase: 0.02

# cost:                      # needs token usage *and* a price (cloud models)
#   max_per_request_usd: 0.002
#   max_increase_pct: 20

# Relative to the baseline.
regression:
  max_delta: -0.05
  max_new_failures:
    hit_at_k: 0

critical:
  by: critical
  metrics: [hit_at_k, must_contain]
  max_failures: 0

groups:
  by: category
  min_items: 5
  metrics: [hit_at_k, must_contain, groundedness]
