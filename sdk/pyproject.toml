[project]
name = "opengrade-ai"
dynamic = ["version", "optional-dependencies"]
description = "Python SDK for AI Evaluation & Observability Platform (OTLP + OpenInference)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.0",
    "pydantic>=2.10.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[project.scripts]
opengrade = "opengrade.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", fallback_version = "0.0.0" }

[tool.hatch.metadata.hooks.custom.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
openai = [
    "openinference-instrumentation-openai>=0.1.0",
]
anthropic = [
    "openinference-instrumentation-anthropic>=0.1.0",
]
langchain = [
    "openinference-instrumentation-langchain>=0.1.0",
]
llama-index = [
    "openinference-instrumentation-llama-index>=0.1.0",
]
bedrock = [
    "openinference-instrumentation-bedrock>=0.1.0",
]
ai = [
    "opengrade-ai[openai,anthropic,langchain,llama-index,bedrock]",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { git = { commit = true, tags = true } }]

# Monorepo only: resolve [ui] against local server until PyPI publish exists.
# Not included in the published wheel metadata.
[tool.uv.sources]
opengrade-ai-server = { path = "../backend", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/opengrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opengrade"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openinference.*"]
ignore_missing_imports = true
