[project]
name = "aiobs"
version = "0.1.0"
description = "Python SDK for AI Evaluation & Observability Platform (OTLP + OpenInference)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
openai = [
    "openinference-instrumentation-openai>=0.1.0",
]
anthropic = [
    "openinference-instrumentation-anthropic>=0.1.0",
]
langchain = [
    "openinference-instrumentation-langchain>=0.1.0",
]
llama-index = [
    "openinference-instrumentation-llama-index>=0.1.0",
]
bedrock = [
    "openinference-instrumentation-bedrock>=0.1.0",
]
ai = [
    "aiobs[openai,anthropic,langchain,llama-index,bedrock]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
