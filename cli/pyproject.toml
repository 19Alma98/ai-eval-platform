[project]
name = "aiobs-cli"
version = "0.1.0"
description = "CLI for AI Evaluation & Observability Platform release gates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
aiobs = "aiobs_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
