name: Publish

# Publishes aiobs-eval-server then aiobs-eval to PyPI via Trusted Publishing (OIDC).
# Trigger: push tag vX.Y.Z, or workflow_dispatch (dry-run by default).
# Both versions come from the git tag via hatch-vcs; no version is written in the repo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheels only; skip PyPI upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs tags and history

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.8.4"

      - name: Set up Python
        run: uv python install 3.12

      - name: Check tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]*)?$ ]]; then
            echo "Tag must look like vX.Y.Z (got: ${GITHUB_REF_NAME})" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package UI into aiobs_server
        run: ./scripts/package-ui.sh

      - name: Build aiobs-eval-server
        working-directory: backend
        env:
          AIOBS_RELEASE_BUILD: "1"
        run: uv build

      - name: Build aiobs-eval
        working-directory: sdk
        env:
          AIOBS_RELEASE_BUILD: "1"
        run: uv build

      - name: Collect and verify dist
        id: version
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a backend/dist/. dist/
          cp -a sdk/dist/. dist/
          ls -la dist/

          python3 <<'PY'
          import os
          import sys
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          dist = Path("dist")
          server_wheels = list(dist.glob("aiobs_eval_server-*-py3-none-any.whl"))
          sdk_wheels = list(dist.glob("aiobs_eval-*-py3-none-any.whl"))
          if len(server_wheels) != 1 or len(sdk_wheels) != 1:
              print("expected one wheel each for server and sdk:", server_wheels, sdk_wheels, file=sys.stderr)
              sys.exit(1)

          def dist_info(zf, suffix):
              return zf.read(next(n for n in zf.namelist() if n.endswith(f".dist-info/{suffix}"))).decode()

          with zipfile.ZipFile(server_wheels[0]) as zf:
              if "aiobs_server/_ui/index.html" not in zf.namelist():
                  print("server wheel missing aiobs_server/_ui/index.html", file=sys.stderr)
                  sys.exit(1)
              server_eps = dist_info(zf, "entry_points.txt")
              server_meta = Parser().parsestr(dist_info(zf, "METADATA"))

          with zipfile.ZipFile(sdk_wheels[0]) as zf:
              sdk_meta = Parser().parsestr(dist_info(zf, "METADATA"))
              sdk_eps = dist_info(zf, "entry_points.txt")

          # Both versions come from the same git tag; each wheel pins the other exactly.
          version = sdk_meta["Version"]
          if server_meta["Version"] != version:
              print(f"version mismatch: sdk={version} server={server_meta['Version']}", file=sys.stderr)
              sys.exit(1)
          expected = os.environ["EXPECTED_VERSION"].removeprefix("v")
          if expected and version != expected:
              print(f"built version {version} != tag {expected}", file=sys.stderr)
              sys.exit(1)
          if f"aiobs-eval-server=={version}; extra == 'ui'" not in sdk_meta.get_all("Requires-Dist", []):
              print("sdk wheel must pin aiobs-eval-server in the [ui] extra", file=sys.stderr)
              sys.exit(1)
          if f"aiobs-eval=={version}" not in server_meta.get_all("Requires-Dist", []):
              print("server wheel must pin aiobs-eval", file=sys.stderr)
              sys.exit(1)

          # Exactly one dist may own the `aiobs` console script (the SDK).
          if "aiobs = aiobs.cli:main" not in sdk_eps:
              print("sdk wheel missing `aiobs` console script", file=sys.stderr)
              sys.exit(1)
          if any(line.split("=")[0].strip() == "aiobs" for line in server_eps.splitlines()):
              print("server wheel must not ship the `aiobs` console script", file=sys.stderr)
              sys.exit(1)
          print("dist OK:", server_wheels[0].name, sdk_wheels[0].name)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    environment:
      name: pypi
      url: https://pypi.org/project/aiobs-eval/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Upload both projects from the same workflow; each needs a Trusted
          # Publisher on PyPI pointing at this repo + publish.yml + env `pypi`.
          skip-existing: false
