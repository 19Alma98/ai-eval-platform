[project]
name = "opengrade-ai-server"
dynamic = ["version", "dependencies"]
description = "OpenGrade server (FastAPI API + packaged UI)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alessandro Magliola", email = "alessandromagliola1998@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: FastAPI",
]

[project.urls]
Homepage = "https://github.com/19Alma98/ai-eval-platform"
Repository = "https://github.com/19Alma98/ai-eval-platform"
Issues = "https://github.com/19Alma98/ai-eval-platform/issues"
Documentation = "https://github.com/19Alma98/ai-eval-platform#readme"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
opengrade-server = "opengrade_server.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs", "packaging"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", fallback_version = "0.0.0" }

[tool.hatch.metadata.hooks.custom]
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx2>=2.13.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "opentelemetry-proto>=1.28.0",
    "protobuf>=5.0.0",
    "litellm>=1.55.0",
    "jsonschema>=4.23.0",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { git = { commit = true, tags = true } }]
default-groups = ["dev"]

[tool.uv.sources]
opengrade-ai = { path = "../sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/opengrade_server"]
artifacts = [
    "src/opengrade_server/_ui/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "integration: tests that require PostgreSQL",
]
filterwarnings = [
    "ignore:.*ReadOnly.*:UserWarning:pydantic",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["src/opengrade_server/_ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/opengrade_server/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opengrade_server"]
mypy_path = "src"
exclude = ["_ui"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["litellm.*", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
