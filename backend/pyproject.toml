[project]
name = "aiobs-server"
version = "0.1.0"
description = "AI Evaluation & Observability Platform server (FastAPI backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx2>=2.13.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "opentelemetry-proto>=1.28.0",
    "protobuf>=5.0.0",
    "litellm>=1.55.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
# Deprecated: rag_faq now uses the SDK package (`cd sdk && uv sync --extra openai`).
# Kept so existing `uv sync --extra examples` / --all-extras installs still succeed.
examples = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "httpx>=0.28.0",
]

[project.scripts]
aiobs = "aiobs_server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiobs_server"]

[tool.hatch.build.targets.wheel.force-include]
"src/aiobs_server/_ui" = "aiobs_server/_ui"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "integration: tests that require PostgreSQL",
]
filterwarnings = [
    "ignore:.*ReadOnly.*:UserWarning:pydantic",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["src/aiobs_server/_ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/aiobs_server/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aiobs_server"]
mypy_path = "src"
exclude = ["_ui"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["litellm.*", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
